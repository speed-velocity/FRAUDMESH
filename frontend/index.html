<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FraudMesh investigation console for explainable fraud signals, evidence, and human-reviewed cases." />
    <meta name="theme-color" content="#f6f2ea" />
    <link rel="icon" type="image/png" href="/assets/fraudmesh-logo-for-dark.png" />
    <title>FraudMesh · Investigation Console</title>
    <script>
      (() => {
        let storedMode = null;
        let storedTheme = null;
        try { storedMode = localStorage.getItem("fraudmesh_mode"); storedTheme = localStorage.getItem("fraudmesh_theme"); } catch {}
        const mode = storedMode === "dark" || storedMode === "light" ? storedMode : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.mode = mode;
        document.documentElement.dataset.theme = storedTheme === "neoclassical" ? "neoclassical" : "editorial";
        document.querySelector('meta[name="theme-color"]').setAttribute("content", mode === "dark" ? "#14110d" : "#f6f2ea");
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
