<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="nemo-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="nemo-title">Nemo, the FraudMesh investigation assistant</title>
<!-- Layered Nemo avatar. Animate by group id.
     CSS tip: svg g { transform-box: fill-box; transform-origin: center; }
     arm-left / arm-right pivot at the shoulder: transform-origin: 100% 0 (left arm) / 0 0 (right arm).
     Suggested "thinking" order: n-crown > link-head > n-right > n-low > n-left > n-torso > link-torso > n-hip-right > n-hip-left -->
<g id="nemo" fill="none" stroke="#F4F4F6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">

 <g id="body">
  <path id="neck" d="M352 548 H672"/>
  <path id="collar" d="M357 553 L511 637 M667 550 L511 637"/>
  <path id="torso-lines" d="M356 560 L416 711 M416 711 L511 637 M416 711 L511 750 L602 710"/>
  <path id="side-arcs" d="M352 605 C352 680 365 740 430 805 M672 605 C672 680 659 740 594 805"/>
  <path id="legs" d="M416 711 L440 815 M511 750 L440 815 M511 750 L583 815"/>
  <g id="foot-left"><circle cx="440" cy="815" r="28.4" fill="#F4F4F6" stroke="none"/></g>
  <g id="foot-right"><circle cx="583" cy="815" r="28.4" fill="#F4F4F6" stroke="none"/></g>
 </g>

 <g id="head">
  <path id="hood" d="M511 214 L392 222 L321 304 L299 345 L289 403 L282 438 C282 495 305 537 345 549 M511 214 L631 223 L703 304 L725 345 L735 403 L742 438 C742 495 719 537 679 549"/>
  <path id="face" d="M346 377 V461 L352 470 L458 546 M677 377 V461 L674 468 L566 546"/>
  <path id="crown-lines" d="M300 412 L346 377 M724 412 L677 377 M392 222 L418 293 M631 223 L603 278 M346 377 L418 293 M334 328 L418 293 M418 293 L511 214 M418 293 L511 342 M511 214 V342 M677 377 L603 285 M691 327 L603 285"/>
 </g>

 <g id="arm-left">
  <path d="M350 560 C320 588 296 640 290 703 M295 733 L350 683"/>
  <circle id="hand-left" cx="295" cy="733" r="28.4" fill="#F4F4F6" stroke="none"/>
 </g>
 <g id="arm-right">
  <path d="M672 560 C702 588 726 640 732 703 M729 733 L674 683"/>
  <circle id="hand-right" cx="729" cy="733" r="28.4" fill="#F4F4F6" stroke="none"/>
 </g>

 <g id="links" fill="none" stroke-width="16">
  <path id="link-head" stroke="#2E187C" d="M511 214 L603 278 L511 342"/>
  <path id="link-torso" stroke="#6412D9" d="M511 637 L602 710 L583 790"/>
  <path id="link-torso-dark" stroke="#2E187C" d="M667 565 L602 710"/>
 </g>

 <g id="nodes" stroke="none">
  <g id="n-crown" class="node"><circle cx="511" cy="214" r="32" fill="#F4F4F6"/><circle class="core" cx="511" cy="214" r="21" fill="#680FE5"/></g>
  <g id="n-left" class="node"><circle cx="418" cy="293" r="29" fill="#F4F4F6"/><circle class="core" cx="418" cy="293" r="17" fill="#782EB7"/></g>
  <g id="n-low" class="node"><circle cx="511" cy="342" r="29" fill="#F4F4F6"/><circle class="core" cx="511" cy="342" r="17" fill="#6911DF"/></g>
  <g id="n-right" class="node"><circle cx="603" cy="278" r="29" fill="#2E187C"/><circle class="core" cx="603" cy="278" r="15" fill="#670BE8"/></g>
  <g id="n-torso" class="node"><circle cx="511" cy="637" r="29" fill="#F4F4F6"/><circle class="core" cx="511" cy="637" r="17" fill="#7B2FB6"/></g>
  <g id="n-hip-left" class="node"><circle cx="416" cy="711" r="25" fill="#F4F4F6"/><circle class="core" cx="416" cy="711" r="13" fill="#782FB5"/></g>
  <g id="n-hip-right" class="node"><circle cx="602" cy="710" r="29" fill="#6414D8"/><circle class="core" cx="602" cy="710" r="15" fill="#2E187D"/></g>
 </g>

 <g id="eyes" stroke="#F4F4F6" stroke-width="12">
  <g id="eye-left"><path d="M386 421 H476"/><circle cx="431" cy="421" r="21" fill="#F4F4F6" stroke="none"/></g>
  <g id="eye-right"><path d="M547 421 H637"/><circle cx="592" cy="421" r="21" fill="#F4F4F6" stroke="none"/></g>
 </g>
</g>
</svg>
